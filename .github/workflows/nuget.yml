name: Publish Nuget

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack (e.g. 1.4.6). Required when running manually.'
        required: true
        type: string
      dry_run:
        description: 'Skip the nuget push step.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Builds, packs and generates SBOMs with a read-only token and no secrets. Dry runs stop here.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # MinVer needs full history + tags to derive the version
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Resolve version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # On a tag push MinVer derives the version from the checked-out v* tag.
          # On a manual run there is no tag, so later steps override MinVer with the requested version.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Strict SemVer 2.0.0. The value is written to $GITHUB_OUTPUT and reaches dotnet arguments,
          # so reject anything else. Do not echo the rejected value: it may carry workflow commands.
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Version is not a valid SemVer 2.0.0 string (expected e.g. 1.4.6 or 2.0.0-beta.1)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set --
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then set -- "-p:MinVerVersionOverride=${VERSION}"; fi
          dotnet build --configuration Release --no-restore "$@"

      - name: Pack
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set --
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then set -- "-p:MinVerVersionOverride=${VERSION}"; fi
          dotnet pack --configuration Release --no-build --output . "$@"

      - name: Generate SBOM
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          # Generate from temporary consumers that restore the freshly packed local .nupkg files.
          # That keeps project references represented as the NuGet dependencies consumers install.
          SBOM_INPUT_DIR="$(mktemp -d)"
          LOCAL_NUGET_SOURCE="$PWD"

          create_sbom_input() {
            local package_id="$1"
            local project_path="$SBOM_INPUT_DIR/${package_id}.SbomInput.csproj"

            cat > "$project_path" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>netstandard2.0;net8.0;net10.0</TargetFrameworks>
              <RestoreSources>${LOCAL_NUGET_SOURCE};https://api.nuget.org/v3/index.json</RestoreSources>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="${package_id}" Version="${VERSION}" />
            </ItemGroup>
          </Project>
          EOF
          }

          normalize_sbom() {
            local package_id="$1"
            local raw_path="$2"
            local output_path="$3"
            local root_ref="pkg:nuget/${package_id}@${VERSION}"

            jq --arg root_ref "$root_ref" '
              .components = ((.components // []) | map(select(.purl != $root_ref and ."bom-ref" != $root_ref))) |
              .dependencies = (
                (.dependencies // [])
                | group_by(.ref)
                | map({
                    ref: .[0].ref,
                    dependsOn: ([.[].dependsOn[]?] | unique | map(select(. != $root_ref)))
                  })
              )
            ' "$raw_path" > "$output_path"
          }

          generate_package_sbom() {
            local package_id="$1"
            local output_path="$2"
            local raw_filename="${package_id}.raw.bom.json"
            local project_path="$SBOM_INPUT_DIR/${package_id}.SbomInput.csproj"

            create_sbom_input "$package_id"
            dotnet CycloneDX "$project_path" \
              --output "$SBOM_INPUT_DIR" --filename "$raw_filename" \
              --output-format Json --exclude-dev \
              --set-name "$package_id" --set-version "$VERSION" --set-type Library --set-nuget-purl
            normalize_sbom "$package_id" "$SBOM_INPUT_DIR/$raw_filename" "$output_path"
          }

          generate_package_sbom GoogleMapsApi GoogleMapsApi.bom.json
          generate_package_sbom GoogleMapsApi.Extensions.DependencyInjection GoogleMapsApi.Extensions.DependencyInjection.bom.json

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nupkg-${{ steps.get_version.outputs.VERSION }}
          if-no-files-found: error
          path: |
            *.nupkg
            *.snupkg
            *.bom.json

  # Attests, pushes to NuGet and creates the GitHub Release. Only this job holds write permissions and
  # the NUGET_API_KEY environment secret, and it only exists for real publishes, so dry runs never get them.
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    # Gate real publishes behind the 'release' environment (required reviewer).
    environment: release
    permissions:
      contents: write       # create GitHub Release
      id-token: write       # Sigstore OIDC
      attestations: write   # GitHub attestations API

    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: nupkg-${{ needs.build.outputs.version }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: '*.nupkg'

      - name: Publish NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ./*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # no checkout in this job, so tell gh which repo
          VERSION: ${{ needs.build.outputs.version }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" ./*.nupkg ./*.bom.json "${ATTESTATION_BUNDLE}" --clobber
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes \
              ./*.nupkg ./*.bom.json "${ATTESTATION_BUNDLE}"
          fi
